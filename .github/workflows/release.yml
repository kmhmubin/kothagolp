name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.0.0)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > kothagolp-release.jks

      - name: Create keystore.properties
        run: |
          cat > keystore.properties << 'PROPS'
          storeFile=../kothagolp-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          PROPS

      - name: Write Google OAuth credentials
        run: |
          mkdir -p app/src/main/assets
          if [ -n "$GOOGLE_CLIENT_SECRETS_BASE64" ]; then
            echo "$GOOGLE_CLIENT_SECRETS_BASE64" | base64 -d > app/src/main/assets/client_secrets.json
            echo "Google Drive sync credentials written."
          else
            echo "ERROR: GOOGLE_CLIENT_SECRETS_BASE64 secret is missing — production build cannot have sync disabled."
            exit 1
          fi
        env:
          GOOGLE_CLIENT_SECRETS_BASE64: ${{ secrets.GOOGLE_CLIENT_SECRETS_BASE64 }}

      - name: Build release APKs
        run: ./gradlew assembleRelease

      - name: Prepare release assets
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | grep -o '"[^"]*"' | tr -d '"' | head -1)
          mkdir -p release-assets

          for apk in app/build/outputs/apk/release/*.apk; do
            filename=$(basename "$apk")
            # Extract ABI from filename: app-arm64-v8a-release.apk → arm64-v8a
            abi=$(echo "$filename" | sed 's/^app-//' | sed 's/-release\.apk$//')
            if [ "$abi" = "universal" ]; then
              newname="Kothagolp-v${VERSION}-universal.apk"
            else
              newname="Kothagolp-v${VERSION}-${abi}.apk"
            fi
            cp "$apk" "release-assets/$newname"
            echo "→ $newname"
          done

      - name: Get release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Kothagolp ${{ steps.tag.outputs.tag }}"
          body: |
            ## Kothagolp ${{ steps.tag.outputs.tag }}

            ### Pick the right APK for your device

            | APK | Device |
            |-----|--------|
            | `arm64-v8a` | Most Android phones (2017 and newer) ✅ recommended |
            | `armeabi-v7a` | Older Android phones (pre-2017) |
            | `x86_64` | Android emulators / Intel tablets |
            | `universal` | If unsure — works on all devices (larger file) |

          files: release-assets/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
